# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Point Data Abstraction Library (PDAL)
author: ""
copyright: "2026"
logo: "_static/logo/pdal_logo-outlined.svg"

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: cache
  timeout: -1
  run_in_temp: true

# Define the name of the latex output file for PDF builds
latex:
  use_jupyterbook_latex: true # use sphinx-jupyterbook-latex for pdf builds as default
#  latex_engine: pdflatex
#  latex_documents:
#    targetname: "pdal.tex"
#    startdocname: "index.md"
#    title: "PDAL: Point cloud Data Abstraction Library"
#    author: "Andrew Bell\\Brad Chambers\\Howard Butler\\Michael Gerlek\\PDAL Contributors"
#    theme: "manual"


# Information about where the book exists on the web
repository:
  url: https://github.com/PDAL/PDAL  # Online location of your book
  path_to_book: book/  # Optional path to your book, relative to the repository root
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  extra_navbar: ""
  use_edit_page_button: true
  favicon: "./_static/logo/pdal_favicon.svg"
  short_title: "Documentation"
  baseurl: "https://pdal.org"
  html_show_copyright: false
  html_short_title: PDAL
  html_title: PDAL
  extra_footer: |
    <a href="https://hobu.co/access.html"><img width="30px" src="/_static/logo/hobu-emblem-32x32.png" /></a> <a href="/copyright.html">Copyright</a> ©2025 <a href="https://github.com/abellgithub">Andrew Bell</a>, <a href="https://github.com/chambbj">Brad Chambers</a>, <a href="http://github.com/hobu">Howard Butler</a>, and <a href="https://github.com/PDAL/PDAL/graphs/contributors">others</a>


sphinx:
  project: "Point cloud Data Abstraction Library"
  copyright: "%Y, PDAL Authors"
  # Needed so the html_theme_options.logo override below (light/dark navbar
  # logo) merges into the theme options jupyter-book already builds from the
  # `html:` section above, instead of replacing that dict outright.
  recursive_update: true
  local_extensions:
    embed: ./_ext
    rtd_deploy: ./_ext
  extra_extensions:
    - breathe
    - sphinx.ext.autodoc
    - sphinx.ext.mathjax
    - sphinx.ext.intersphinx
    - sphinxcontrib.bibtex
    - notfound.extension
    - sphinxcontrib.jquery
  config:
    suppress_warnings: ["etoc.toctree"]
    html_show_copyright: false
    html_css_files:
      - css/prev-next-cta.css
    html_js_files:
      - js/prev-next-cta.js
    bibtex_bibfiles:
      - references.bib
    bibtex_reference_style: author_year
    breathe_projects:
      api: "doxygen/xml"
    breathe_diagram:
      - path: "./doxygen/html"
      - html-path: "../../../doxygen/html"
      - project: "api"
      - no-link: false
    breathe_domain_by_extension:
      hpp: "cpp"
      h: "cpp"
    breathe_default_project: api
    # Light/dark navbar logo (sphinx-book-theme inherits this from
    # pydata-sphinx-theme). Both are the outline-path SVGs -- the "pdal"
    # wordmark is baked in as vector paths (see generate_outlined_svgs
    # commentary in the master SVGs), not <text>, so neither needs the
    # Bauhaus 93 font installed to render correctly. The dark variant adds
    # a white halo (an SVG filter, not a font or raster effect) so the mark
    # stays visible against a dark background.
    html_theme_options:
      logo:
        image_light: "_static/logo/pdal_logo-outlined.svg"
        image_dark: "_static/logo/pdal_logo-outlined-dark.svg"
    latex_logo: "./_static/pdal-logo.png"
    latex_use_parts: false
    latex_show_urls: "inline"

    latex_documents:
      -
        - "index"
        - "pdal.tex"
        - "PDAL: Point cloud Data Abstraction Library"
        - 'Andrew Bell\\Brad Chambers\\Howard Butler\\Michael Gerlek\\PDAL Contributors'
        - "manual"
        - "False"
    latex_elements:
      preamble: ' \makeatother
  %\color {blue}
  %\normalcolor {dark blue}
  \definecolor{VerbatimColor}{RGB}{239, 239, 239}
  \definecolor{VerbatimBorderColor}{RGB}{148, 148, 148}
  \usepackage{geometry}
     \geometry{
     letterpaper,
     left={30mm},
  }
  \raggedright'
      figure_align: "htbp"
      releasename: ""
      pointsize: "12pt"
      papersize: "letterpaper"
    pygments_style: "sphinx"
