channels:
  - conda-forge
dependencies:
  - doxygen
  - make
  - python-pdal
  - jupyter-book
  - breathe > 4.34
  - sphinxcontrib-jquery
  - sphinx-notfound-page
  - sphinx-inline-tabs
  - cmake
  - pillow
  - sphinx-jupyterbook-latex
  - imagemagick
  - compilers
  # Needed so sphinxcontrib.rsvgconverter (enabled in _config.yml) can
  # rasterize SVG content images to PDF-embeddable format for the LaTeX/PDF
  # build -- pdflatex has no native SVG support. Also used by
  # doc/generate_logo_assets.sh to regenerate the checked-in PNG logo
  # assets after editing a master SVG in _static/logo.
  - librsvg
  - sphinxcontrib-svg2pdfconverter


