channels:
  - conda-forge
dependencies:
  - doxygen
  - make
  - python-pdal
  - jupyter-book
  - breathe > 4.34
  - sphinxcontrib-jquery
  - sphinx-notfound-page
  - sphinx-inline-tabs
  - cmake
  - pillow
  - sphinx-jupyterbook-latex
  - imagemagick
  - compilers
  # librsvg is optional: only needed to run
  # doc/generate_logo_assets.sh to regenerate the checked-in PNG logo
  # assets after editing a master SVG in _static/logo. Not required to
  # build the docs. (e.g. `conda install -n <env> librsvg`)


